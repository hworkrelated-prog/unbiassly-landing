<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Unbiassly opt-ins</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f4ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314130f'/%3E%3Crect x='8' y='11' width='16' height='3.2' rx='1.6' fill='%23f6f4ef'/%3E%3Crect x='8' y='17.8' width='16' height='3.2' rx='1.6' fill='%23f6f4ef'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --paper:#ffffff; --ink:#14130f; --ink-2:#4a4740; --ink-3:#8a867c;
  --line:rgba(20,19,15,.10); --line-2:rgba(20,19,15,.16);
  --teal:#0f766e; --amber:#c8611f; --navy:#1b2348; --orange:#f58220;
  --r:22px; --max:1120px;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",ui-serif,Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow::before{content:"";width:18px;height:1.5px;background:currentColor;opacity:.7}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.82);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
header.top.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.mark{width:30px;height:30px;flex:none}
.brand small{font-weight:500;color:var(--ink-3);font-size:14px;letter-spacing:0}
nav.links{display:flex;gap:6px}
nav.links a{font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 14px;border-radius:999px;transition:background .2s,color .2s}
nav.links a:hover{background:rgba(20,19,15,.06);color:var(--ink)}

/* Hero */
.hero{padding:84px 0 72px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);font-size:13.5px;font-weight:500;color:var(--ink-2)}
.flag{width:20px;height:14px;border-radius:3px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6.4vw,82px);line-height:1.0;letter-spacing:-.025em;margin:26px 0 22px}
h1 em{font-style:italic;color:var(--ink-2)}
.lede{font-size:clamp(17px,1.6vw,19.5px);line-height:1.6;color:var(--ink-2);max-width:560px;margin:0 0 34px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .2s ease,background .2s,box-shadow .2s}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(20,19,15,.5)}
.btn.ghost{border:1px solid var(--line-2);background:var(--paper)}
.btn.ghost:hover{transform:translateY(-1px);border-color:rgba(20,19,15,.3)}
.btn svg{width:16px;height:16px}

/* Structure card */
.org{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 30px 60px -40px rgba(20,19,15,.35)}
.org-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--ink);color:var(--bg)}
.org-head .mark{width:34px;height:34px}
.org-head b{display:block;font-size:16px;letter-spacing:-.01em}
.org-head span{font-size:12.5px;opacity:.65}
.org-branches{position:relative;margin-top:18px;padding-left:22px}
.org-branches::before{content:"";position:absolute;left:8px;top:-18px;bottom:30px;width:1.5px;background:var(--line-2)}
.branch{position:relative;margin-bottom:16px}
.branch:last-child{margin-bottom:0}
.branch::before{content:"";position:absolute;left:-14px;top:13px;width:12px;height:1.5px;background:var(--line-2)}
.branch-label{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:4px 0 8px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);font-size:14.5px;font-weight:600;transition:background .2s,border-color .2s,transform .2s}
.chip:hover{background:#faf9f6;border-color:var(--line-2);transform:translateX(2px)}
.chip .ico{width:24px;height:24px;border-radius:7px;flex:none}
.chip .url{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:13px}

/* Sections */
section.block{padding:88px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:38px;flex-wrap:wrap}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(36px,4.4vw,56px);line-height:1.02;letter-spacing:-.02em;margin:14px 0 0}
.sec-head p{max-width:420px;margin:0;color:var(--ink-2);font-size:16.5px}
.divider{height:1px;background:var(--line);border:0;margin:0}

.group{margin-top:12px}
.group + .group{margin-top:56px}
.group-title{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.group-title .num{font:600 12px/1 var(--sans);letter-spacing:.1em;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:7px 10px}
.group-title h3{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.group-title .rule{flex:1;height:1px;background:var(--line)}
.group-title .count{font-size:13.5px;color:var(--ink-3);font-weight:500}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cards.one{grid-template-columns:1fr}
.card{--c:var(--ink);position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 22px;min-height:300px;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s;overflow:hidden}
.card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card:hover{transform:translateY(-4px);box-shadow:0 26px 50px -30px rgba(20,19,15,.35);border-color:var(--line-2)}
.card:hover::after{transform:scaleX(1)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.card .logo{width:46px;height:46px;border-radius:13px}
.tag{font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);padding:6px 11px;border-radius:999px;letter-spacing:.01em}
.card h4{margin:0 0 4px;font-size:23px;font-weight:700;letter-spacing:-.025em}
.card .kicker{margin:0 0 14px;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink-2);line-height:1.25}
.card p.desc{margin:0 0 24px;color:var(--ink-2);font-size:15.5px;line-height:1.6}
.card .go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px;font-weight:600}
.card .go .arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f2f0ea;transition:background .25s,color .25s,transform .25s}
.card:hover .go .arrow{background:var(--c);color:#fff;transform:rotate(-45deg)}
.card .go svg{width:15px;height:15px}

.card.wide{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;min-height:0;padding:32px}
.card.wide .left{display:flex;flex-direction:column}
.points{list-style:none;margin:0;padding:0;display:grid;gap:10px;align-content:center}
.points li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#faf8f4;border:1px solid var(--line);font-size:15px;font-weight:500}
.points li svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--orange)}

/* Founder */
.founder{background:var(--ink);color:var(--bg);border-radius:32px;padding:56px;display:grid;grid-template-columns:auto 1fr;gap:52px;align-items:center;position:relative;overflow:hidden}
.founder::before{content:"";position:absolute;width:520px;height:520px;right:-160px;top:-220px;background:radial-gradient(closest-side,rgba(245,130,32,.20),transparent);pointer-events:none}
.portrait{width:200px;height:200px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px rgba(246,244,239,.06),0 0 0 7px rgba(246,244,239,.14)}
.founder .eyebrow{color:rgba(246,244,239,.55)}
.founder h2{color:var(--bg)}
.founder h2 em{font-style:italic;color:rgba(246,244,239,.6)}
.founder p{color:rgba(246,244,239,.72);font-size:16.5px;max-width:600px;margin:16px 0 28px}
.founder .btn.light{background:var(--bg);color:var(--ink)}
.founder .btn.light:hover{transform:translateY(-1px)}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.socials a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(246,244,239,.16);color:rgba(246,244,239,.85);transition:background .25s,color .25s,transform .25s,border-color .25s}
.socials a:hover{background:var(--bg);color:var(--ink);border-color:var(--bg);transform:translateY(-2px)}
.socials svg{width:18px;height:18px;fill:currentColor}
.founder-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.founder-actions .mail{font-size:14.5px;color:rgba(246,244,239,.7);border-bottom:1px solid rgba(246,244,239,.25);padding-bottom:2px;margin-left:8px}
.founder-actions .mail:hover{color:var(--bg)}

footer{padding:40px 0 48px;color:var(--ink-3);font-size:14px}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:28px}
.foot nav{display:flex;gap:18px;flex-wrap:wrap}
.foot nav a:hover{color:var(--ink)}

/* Motion */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
.no-js .reveal{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
}

/* Responsive */
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:44px}
  .cards{grid-template-columns:1fr 1fr}
  .card.wide{grid-template-columns:1fr;gap:24px}
  .founder{grid-template-columns:1fr;padding:44px 32px;gap:28px}
}
@media (max-width:640px){
  .wrap{padding:0 20px}
  nav.links{display:none}
  .brand small{display:none}
  .hero{padding:44px 0 56px}
  h1{margin:22px 0 18px}
  .lede{margin-bottom:28px}
  .cta .btn{flex:1 1 100%;justify-content:center}
  .btn{height:48px;padding:0 20px}
  .org{padding:18px;border-radius:24px}
  .chip .url{display:none}
  section.block{padding:64px 0}
  .sec-head{margin-bottom:28px}
  .cards{grid-template-columns:1fr}
  .card{min-height:0;padding:22px}
  .card.wide{padding:22px}
  .group-title .count{display:none}
  .founder{padding:36px 24px;border-radius:26px;text-align:left}
  .portrait{width:120px;height:120px}
  .founder-actions .mail{margin-left:0;width:100%;border:0}
  .socials{gap:6px}
  .socials a{width:38px;height:38px}
  .socials svg{width:16px;height:16px}
}

/* Opt-in */
.optin{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:44px;display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start;box-shadow:0 30px 60px -44px rgba(20,19,15,.35)}
.optin h2{margin-top:14px}
.optin .intro p{color:var(--ink-2);font-size:16.5px;margin:16px 0 22px;max-width:420px}
.optin .perks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.optin .perks li{display:flex;gap:11px;align-items:flex-start;font-size:15px;font-weight:500;color:var(--ink-2)}
.optin .perks svg{flex:none;width:18px;height:18px;margin-top:3px;color:var(--orange)}
.oform{display:grid;gap:16px}
.oform .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:7px}
.field label,.field .lbl{font-size:13.5px;font-weight:600;color:var(--ink)}
.field label small{font-weight:500;color:var(--ink-3)}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=password]{height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:#fbfaf7;font:500 15.5px var(--sans);color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s;width:100%}
.field input:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px rgba(20,19,15,.07)}
.field.bad input{border-color:#c2410c;background:#fff8f3}
.field .err{font-size:13px;color:#c2410c;min-height:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills span{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:#fbfaf7;font-size:14px;font-weight:600;color:var(--ink-2);transition:all .2s}
.pills label:hover span{border-color:rgba(20,19,15,.3)}
.pills input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pills input:focus-visible+span{box-shadow:0 0 0 4px rgba(20,19,15,.12)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-2);line-height:1.5;cursor:pointer}
.consent input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink)}
.consent.bad{color:#c2410c}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.oform .btn{border:0;cursor:pointer;justify-content:center;font-family:var(--sans)}
.oform .btn[disabled]{opacity:.75;cursor:progress;transform:none!important}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:none}
.busy .spin{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.status{font-size:14px;color:var(--ink-3);min-height:20px;margin:0}
.status.bad{color:#c2410c}
.fine{font-size:12.5px;color:var(--ink-3);margin:0}
.fine a{text-decoration:underline;text-underline-offset:2px}
.done{display:none;text-align:center;padding:26px 10px}
.done .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal)}
.done .tick svg{width:30px;height:30px}
.done h3{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}
.done p{color:var(--ink-2);margin:0 auto 22px;max-width:380px}
.sent .oform{display:none}
.sent .done{display:block;animation:pop .5s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:980px){.optin{grid-template-columns:1fr;gap:28px;padding:36px 32px}}
@media (max-width:640px){.optin{padding:26px 20px;border-radius:24px}.oform .row{grid-template-columns:1fr}.oform .btn{width:100%}}
.optin h2 em,.page h1 em{font-style:italic;color:var(--ink-2)}
.status:empty{display:none}

.login{max-width:420px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:38px 34px;box-shadow:0 30px 60px -44px rgba(20,19,15,.35)}
.login .mark{width:40px;height:40px;margin-bottom:18px}
.login h1{font-size:40px;margin:0 0 6px}
.login p.sub{color:var(--ink-2);margin:0 0 24px;font-size:15px}
.login form{display:grid;gap:14px}
.login .btn{width:100%;justify-content:center;border:0;cursor:pointer;font-family:var(--sans)}
.dash{display:none;padding:40px 0 60px}
.authed .login{display:none}.authed .dash{display:block}
.dash-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.dash-head h1{font-size:clamp(38px,4.4vw,54px);margin:10px 0 0}
.dash-head h1 .n{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink-2);background:var(--paper);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;vertical-align:middle;margin-left:10px;letter-spacing:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input{height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font:500 15px var(--sans);min-width:240px;color:var(--ink)}
.tools input:focus{outline:none;border-color:var(--ink)}
.tools .btn{height:46px;border:0;cursor:pointer;font-family:var(--sans)}
.tools .btn.ghost{border:1px solid var(--line-2)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;color:var(--ink-2)}
.stat b{color:var(--ink);font-size:16px;margin-right:6px}
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfaf7;position:sticky;top:0}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfbf8}
td.when{white-space:nowrap;color:var(--ink-2)}
td.when small{display:block;color:var(--ink-3);font-size:12.5px}
td.name{font-weight:600}
td a{border-bottom:1px solid var(--line-2)}
.chipi{display:inline-block;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f2f0ea;white-space:nowrap}
.chipi.TskFlow{background:#e8f3f1;color:#0f766e}.chipi.SellDispatch{background:#fbeee4;color:#b4541a}.chipi.TomaFreight{background:#fff1e3;color:#c35f0a}
.del{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:13px;padding:4px 8px;border-radius:8px}
.del:hover{background:#fff1ec;color:#c2410c}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3)}
.out{background:none;border:0;color:var(--ink-2);font:500 14px var(--sans);cursor:pointer;padding:8px 14px;border-radius:999px}
.out:hover{background:rgba(20,19,15,.06)}
@media (max-width:760px){
  .tools{width:100%}.tools input{flex:1 1 100%;min-width:0}
  thead{display:none} table,tbody,tr,td{display:block;width:100%}
  tr{padding:14px 16px;border-bottom:1px solid var(--line)} td{padding:3px 0;border:0}
  td.when{order:9}
}
@media (max-width:640px){.login{margin-top:6vh;padding:30px 22px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><rect x="8" y="11" width="16" height="3.2" rx="1.6" fill="var(--mk,#f6f4ef)"/><rect x="8" y="17.8" width="16" height="3.2" rx="1.6" fill="var(--mk,#f6f4ef)"/></symbol>
  <symbol id="arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="check" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="currentColor" opacity=".14"/><path d="M5.2 9.3l2.4 2.4 5-5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<header class="top" id="top">
  <div class="wrap bar">
    <a class="brand" href="/" aria-label="Unbiassly, Inc. home">
      <svg class="mark" style="color:var(--ink)"><use href="#mark"/></svg>
      Unbiassly <small>Admin</small>
    </a>
    <button class="out" id="signout" hidden>Sign out</button>
  </div>
</header>
<main class="wrap">
  <section class="login" id="login">
    <svg class="mark" style="color:var(--ink)"><use href="#mark"/></svg>
    <h1 class="serif">Admin sign in</h1>
    <p class="sub">View and export everyone who opted in on unbiassly.com.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit"><span class="spin" aria-hidden="true"></span><span class="lbl-txt">Sign in</span></button>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="dash" id="dash">
    <div class="dash-head">
      <div>
        <span class="eyebrow">Opt-ins</span>
        <h1 class="serif">Everyone who signed up<span class="n" id="count">0</span></h1>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search name, email, phone…" aria-label="Search opt-ins">
        <button class="btn ghost" id="refresh" type="button">Refresh</button>
        <button class="btn primary" id="csv" type="button">Export CSV</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Interest</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No opt-ins yet.</div>
    </div>
    <p class="status" id="dstatus" role="status" aria-live="polite" style="margin-top:14px"></p>
  </section>
</main>
<script>
(function(){
  var API='https://unbiassly-optin-api.onrender.com', KEY='unb_admin_token';
  var $=function(id){return document.getElementById(id)};
  var data=[], token=null;
  try{var s=JSON.parse(sessionStorage.getItem(KEY)||'null'); if(s&&s.exp>Date.now()) token=s.token;}catch(e){}
  fetch(API+'/health',{cache:'no-store'}).catch(function(){});
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function api(path,opt){
    opt=opt||{}; opt.headers=opt.headers||{}; if(token) opt.headers.Authorization='Bearer '+token; opt.cache='no-store';
    return fetch(API+path,opt).then(function(r){ if(r.status===401&&token){signout();throw new Error('Your session ended. Please sign in again.');} return r; });
  }
  function signout(){token=null;sessionStorage.removeItem(KEY);document.body.classList.remove('authed');$('signout').hidden=true;$('pw').value='';}
  $('signout').onclick=signout;
  var lf=$('login-form'), lb=lf.querySelector('button'), ls=lf.querySelector('.status');
  lf.addEventListener('submit',function(e){
    e.preventDefault(); var pw=$('pw').value; if(!pw){ls.textContent='Enter the password.';ls.classList.add('bad');return;}
    lb.disabled=true; lb.classList.add('busy'); lb.querySelector('.lbl-txt').textContent='Signing in…'; ls.textContent=''; ls.classList.remove('bad');
    var slow=setTimeout(function(){ls.textContent='Waking up the server. This can take up to a minute…'},5000);
    fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
      .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
      .then(function(r){
        clearTimeout(slow);
        if(!r.ok) throw new Error(r.j.error||'Sign in failed.');
        token=r.j.token; sessionStorage.setItem(KEY,JSON.stringify({token:token,exp:r.j.expiresAt})); $('pw').value=''; ls.textContent=''; show();
      }).catch(function(err){clearTimeout(slow); ls.textContent=err.message==='Failed to fetch'?'Could not reach the server. Try again.':err.message; ls.classList.add('bad');})
      .then(function(){lb.disabled=false;lb.classList.remove('busy');lb.querySelector('.lbl-txt').textContent='Sign in';});
  });
  var fmt=new Intl.DateTimeFormat(undefined,{year:'numeric',month:'short',day:'numeric'});
  var fmtT=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
  function render(){
    var q=$('q').value.trim().toLowerCase();
    var list=!q?data:data.filter(function(o){return [o.name,o.email,o.phone,o.interest].join(' ').toLowerCase().indexOf(q)>-1});
    $('count').textContent=q?(list.length+' of '+data.length):data.length;
    $('empty').hidden=list.length>0; $('empty').textContent=data.length?'No matches.':'No opt-ins yet.';
    $('rows').innerHTML=list.map(function(o){var d=new Date(o.createdAt);
      return '<tr><td class="when">'+esc(fmt.format(d))+'<small>'+esc(fmtT.format(d))+'</small></td><td class="name">'+esc(o.name)+'</td>'+
      '<td><a href="mailto:'+esc(o.email)+'">'+esc(o.email)+'</a></td><td>'+(o.phone?'<a href="tel:'+esc(o.phone.replace(/[^+\d]/g,''))+'">'+esc(o.phone)+'</a>':'<span style="color:var(--ink-3)">—</span>')+'</td>'+
      '<td><span class="chipi '+esc(o.interest)+'">'+esc(o.interest)+'</span></td><td><button class="del" data-id="'+esc(o.id)+'" title="Delete">Delete</button></td></tr>'}).join('');
    var by={}; data.forEach(function(o){by[o.interest]=(by[o.interest]||0)+1});
    var wk=data.filter(function(o){return Date.now()-new Date(o.createdAt)<7*864e5}).length;
    $('stats').innerHTML='<span class="stat"><b>'+wk+'</b>this week</span>'+Object.keys(by).sort().map(function(k){return '<span class="stat"><b>'+by[k]+'</b>'+esc(k)+'</span>'}).join('');
  }
  function load(){
    $('dstatus').textContent='Loading…'; $('dstatus').classList.remove('bad');
    return api('/api/admin/optins').then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Could not load.');return j})})
      .then(function(j){data=j.optins||[];$('dstatus').textContent='';render();})
      .catch(function(e){$('dstatus').textContent=e.message;$('dstatus').classList.add('bad');});
  }
  function show(){document.body.classList.add('authed');$('signout').hidden=false;load();}
  $('q').addEventListener('input',render);
  $('refresh').onclick=load;
  $('csv').onclick=function(){
    var b=this; b.disabled=true;
    api('/api/admin/optins.csv').then(function(r){if(!r.ok)throw new Error('Export failed.');return r.blob()}).then(function(bl){
      var a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download='unbiassly-optins-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
    }).catch(function(e){$('dstatus').textContent=e.message;$('dstatus').classList.add('bad')}).then(function(){b.disabled=false});
  };
  $('rows').addEventListener('click',function(e){
    var b=e.target.closest('.del'); if(!b) return;
    var o=data.find(function(x){return x.id===b.dataset.id}); if(!o||!confirm('Delete '+o.email+'? This cannot be undone.')) return;
    api('/api/admin/optins/'+o.id,{method:'DELETE'}).then(function(r){if(!r.ok)throw new Error('Delete failed.');data=data.filter(function(x){return x.id!==o.id});render();})
      .catch(function(e){$('dstatus').textContent=e.message;$('dstatus').classList.add('bad')});
  });
  if(token) show();
})();
</script>
</body>
</html>
